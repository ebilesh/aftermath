name: Publish v0.1.0 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 experiments/replay.py experiments/ack-gap.json
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish initial source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "Aftermath v0.1.0" --notes-file RELEASE_NOTES.md
