name: Correctness and frontend build
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 experiments/replay.py experiments/ack-gap.json

  walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_walkthrough.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aftermath-walkthrough
          path: artifacts/*.png
          retention-days: 14
